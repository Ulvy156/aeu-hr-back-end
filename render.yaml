services:
  # ─── Web Service (nginx + php-fpm) ───────────────────────────────────────────
  - type: web
    name: aeu-hr-api
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: starter          # Change to "free" for testing (spins down when idle)
    region: singapore      # Closest to Cambodia — change if needed
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "HR Management System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true   # Render auto-generates a secure key

      # App URL — update to your actual Render domain after first deploy
      - key: APP_URL
        value: https://aeu-hr-api.onrender.com

      # Sanctum — set to your frontend domain (e.g. your-frontend.onrender.com)
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false

      # Database — point to your external MySQL (PlanetScale, Railway, etc.)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local

      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

      - key: BCRYPT_ROUNDS
        value: "12"

  # ─── Queue Worker ─────────────────────────────────────────────────────────────
  - type: worker
    name: aeu-hr-queue
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: starter
    region: singapore
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    envVars:
      - key: APP_NAME
        value: "HR Management System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Paste the APP_KEY generated by the web service
      - key: APP_KEY
        sync: false

      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_LEVEL
        value: error
